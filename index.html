
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TypingPro - Typeshala Nepali & English Typing Tutor</title>
  <meta name="description" content="A high-performance bilingual (Nepali & English) typing tutor application inspired by Typeshala, featuring progressive 300+ levels, real-time WPM and accuracy analytics, interactive virtual keyboard with finger guidance, and smart practice drills.">
  <meta property="og:title" content="TypingPro - Typeshala Nepali & English Typing Tutor">
  <meta property="og:description" content="A high-performance bilingual (Nepali & English) typing tutor application inspired by Typeshala, featuring progressive 300+ levels, real-time WPM and accuracy analytics, interactive virtual keyboard with finger guidance, and smart practice drills.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&family=Hind:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #020617;
      font-family: 'Inter', sans-serif;
    }
    #root {
      height: 100%;
    }
    .mono {
      font-family: 'JetBrains+Mono', monospace;
    }
    .nepali {
      font-family: 'Hind', sans-serif;
    }
    @keyframes key-press {
      0% { transform: scale(1); }
      50% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1); }
    }
    .key-active {
      animation: key-press 0.1s ease-out;
    }
  </style>
  <script>
    // Polyfill for process.env to prevent crashes in production environments
    window.process = { env: { API_KEY: "" } };
  </script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
